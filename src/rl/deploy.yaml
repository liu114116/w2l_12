servo:
  kp_leg: 26.0
  kd_leg: 1.6
  kv_wheel: 0.7
  tau_leg_limit: 0.98
  tau_wheel_limit: 0.29
  law: tau = kp*(q_des - q) - kd*qd  (per leg joint, clipped)
command_limits:
  vx: 0.55
  vy: 0.12
  wz: 0.45
