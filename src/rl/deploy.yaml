- 0.0
- -0.5236
- 1.3963
- 0.0
- -0.5236
- 1.3963
- 0.0
- -0.5236
- 1.3963
action:
  format: absolute
  layout: 0:12 = 12 个腿部目标角 (rad, 绝对角)；12:16 = 4 个轮子目标角速度 (rad/s)
  low:
  - -1.4835
  - -3.0543
  - -2.2689
  - -1.4835
  - -3.0543
  - -2.2689
  - -1.4835
  - -3.0543
  - -2.2689
  - -1.4835
  - -3.0543
  - -2.2689
  - -25.0
  - -25.0
  - -25.0
  - -25.0
