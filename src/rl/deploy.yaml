robot: w2l_12
contract_version: 2
control_freq_hz: 50.0
action_filter_hz: 10.0
obs_dim: 53
act_dim: 16
obs_layout:
- name: base_ang_vel
  size: 3
  scale: 0.25
  frame: body
  unit: rad/s
- name: projected_gravity
  size: 3
  scale: 1.0
  frame: body
- name: command
  size: 3
  scale:
  - 1.0
  - 1.0
  - 1.0
  unit: '[m/s, m/s, rad/s]'
- name: leg_joint_pos_rel
  size: 12
  scale: 1.0
  unit: rad
- name: leg_joint_vel
  size: 12
  scale: 0.05
  unit: rad/s
- name: wheel_vel
  size: 4
  scale: 0.05
  unit: rad/s
- name: last_action
  size: 16
  scale: ((target - neutral) / action_scale)
  unit: 归一化动作
leg_joint_order:
- roll_FL
- hip_FL
- knee_FL
- roll_FR
- hip_FR
- knee_FR
- roll_RL
- hip_RL
- knee_RL
- roll_RR
- hip_RR
- knee_RR
wheel_joint_order:
- wheel_FL
- wheel_FR
- wheel_RL
- wheel_RR
