robot: w2l_12
contract_version: 1
control_freq_hz: 50.0
action_filter_hz: 10.0
obs_dim: 53
act_dim: 16
obs_layout:
- name: base_ang_vel
  size: 3
  scale: 0.25
  frame: body
  unit: rad/s
- name: projected_gravity
  size: 3
  scale: 1.0
  frame: body
- name: command
  size: 3
  scale:
  - 1.0
  - 1.0
  - 1.0
  unit: '[m/s, m/s, rad/s]'
- name: leg_joint_pos_rel
  size: 12
  scale: 1.0
  unit: rad
- name: leg_joint_vel
  size: 12
  scale: 0.05
  unit: rad/s
- name: wheel_vel
  size: 4
  scale: 0.05
  unit: rad/s
- name: last_action
  size: 16
  scale: 1.0
leg_joint_order:
- roll_FL
- hip_FL
- knee_FL
- roll_FR
- hip_FR
- knee_FR
- roll_RL
- hip_RL
- knee_RL
- roll_RR
- hip_RR
- knee_RR
wheel_joint_order:
- wheel_FL
- wheel_FR
- wheel_RL
- wheel_RR
default_leg_pos:
- 0.0
- -0.5236
- 1.3963
- 0.0
- -0.5236
- 1.3963
- 0.0
- -0.5236
- 1.3963
- 0.0
- -0.5236
- 1.3963
action:
  leg_pos_scale:
  - 0.125
  - 0.25
  - 0.25
  - 0.125
  - 0.25
  - 0.25
  - 0.125
  - 0.25
  - 0.25
  - 0.125
  - 0.25
  - 0.25
  wheel_vel_scale: 25.0
  leg_target_limit:
  - - -1.4835
    - -3.0543
    - -2.2689
    - -1.4835
    - -3.0543
    - -2.2689
    - -1.4835
    - -3.0543
    - -2.2689
    - -1.4835
    - -3.0543
    - -2.2689
  - - 1.4835
    - 3.0543
    - 2.2689
    - 1.4835
    - 3.0543
    - 2.2689
    - 1.4835
    - 3.0543
    - 2.2689
    - 1.4835
    - 3.0543
    - 2.2689
  note: action[0:12] -> q_des = default + a*scale; action[12:16] -> w_des = a*wheel_vel_scale
servo:
  kp_leg: 26.0
  kd_leg: 1.6
  kv_wheel: 0.7
  tau_leg_limit: 0.98
  tau_wheel_limit: 0.29
  law: tau = kp*(q_des - q) - kd*qd  (per leg joint, clipped)
command_limits:
  vx: 0.55
  vy: 0.15
  wz: 0.45
stand_height_m: 0.122456
forward_axis_note: 模型前方是 -x；指令 vx>0 表示机器人朝自己的前方走
trained_steps: 12003584
tag: v1
action_mode: servo
policy:
  sb3_zip: checkpoints/v1/model.zip
  onnx: models/policy.onnx
  sha256_16: 28b3bbfd3bc211f6
  trained_steps: 12003584
  onnx_norm: models/policy_norm.onnx
  output_format: targets
  output_layout: 0:12 leg target angles (rad, absolute); 12:16 wheel target speeds
    (rad/s)
env_cfg:
  xml: D:\project\robot_leg\mujoco\w2l_12\src\rl\assets\w2l_12_train.xml
  action_mode: servo
  sim_dt: 0.002
  decimation: 10
  episode_steps: 500
  cmd_lin_x: 0.6
  cmd_lin_y: 0.12
  cmd_ang_z: 1.0
  curriculum_start: 0.35
  curriculum_steps: 30000000.0
  cmd_resample_steps: 250
  zero_cmd_prob: 0.15
  action_filter_hz: 10.0
  latency_min: 0
  latency_max: 2
  obs_noise: 1.0
  obs_noise_dof_pos: 0.01
  obs_noise_dof_vel: 0.5
  obs_noise_gyro: 0.05
  obs_noise_grav: 0.02
  obs_noise_wheel: 0.5
  randomize_friction: true
  friction_range:
  - 0.6
  - 1.4
  randomize_mass: true
  base_mass_range:
  - 0.9
  - 1.15
  com_offset: 0.008
  kp_scale_range:
  - 0.85
  - 1.15
  kd_scale_range:
  - 0.85
  - 1.15
  push_interval_steps:
  - 150
  - 350
  push_vel: 0.5
  slope_max_deg: 0.0
  terminate_height: 0.055
  terminate_tilt: 0.65
  terminate_base_contact: true
  rewards:
    track_lin_vel: 2.0
    track_ang_vel: 2.8
    lin_vel_z: -1.0
    ang_vel_xy: -0.05
    orientation: -2.5
    base_height: -6.0
    joint_acc: -2.5e-07
    action_rate: -0.02
    torques: -0.02
    wheel_acc: -2.5e-07
    collision: -1.5
    dof_limits: -2.0
    stand_still: -0.6
    alive: 0.6
  target_height: 0.122456
  seed: 0
note_limits: training curriculum uses 0.6/0.4/1.0; deployment limits are clipped to
  what the hardware can actually track (parallel wheels cannot strafe; yaw is limited
  by tyre scrub)
stand_regulator:
  v_eps: 0.03
  kp_v: 30.0
  ki_v: 10.0
  kp_w: 0.0
  ki_w: 0.0
  db_v: 0.01
  db_w: 0.0
  max_delta: 10.0
  ramp_s: 0.3
  int_limit: 0.5
  lpf_hz: 8.0
